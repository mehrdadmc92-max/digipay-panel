<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل پذیرندگان و ثبت‌نام حضوری دیجی‌پی</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap');
    body { font-family: 'Vazirmatn', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function DigiPayApp() {
      const [activeTab, setActiveTab] = useState('onsite');
      const [amount, setAmount] = useState(50000000);
      const [mobile, setMobile] = useState('');
      const [nationalId, setNationalId] = useState('');
      const [step, setStep] = useState(1);
      const [guaranteeType, setGuaranteeType] = useState('cheque');

      const calculateMonthlyPayment = (amt) => {
        const rate = 0.23;
        const totalWithFee = amt * (1 + rate);
        return Math.round(totalWithFee / 12);
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (mobile.length === 11 && nationalId.length === 10) {
          setStep(2);
        } else {
          alert('لطفاً شماره موبایل ۱۱ رقمی و کد ملی ۱۰ رقمی معتبر وارد کنید.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          <!-- سایدبار -->
          <aside className="w-full md:w-64 bg-slate-900 text-white p-5 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 pb-6 border-b border-slate-800">
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl">D</div>
                <div>
                  <h1 className="font-bold text-lg">دیجی‌پی | DigiPay</h1>
                  <p className="text-xs text-slate-400">پنل شعب و پذیرندگان حضوری</p>
                </div>
              </div>
              <nav className="mt-6 space-y-2">
                <button 
                  onClick={() => setActiveTab('onsite')} 
                  className={`w-full text-right px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'onsite' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                  🛒 ثبت‌نام & خرید حضوری
                </button>
                <button 
                  onClick={() => setActiveTab('calculator')} 
                  className={`w-full text-right px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'calculator' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                  🧮 محاسبه‌گر اقساط
                </button>
                <button 
                  onClick={() => setActiveTab('transactions')} 
                  className={`w-full text-right px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'transactions' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                  📊 لیست تراکنش‌ها
                </button>
              </nav>
            </div>
            <div className="text-xs text-slate-500 text-center border-t border-slate-800 pt-4">
              متصل به mydigipay.com
            </div>
          </aside>

          <!-- محتوای اصلی -->
          <main className="flex-1 p-6 md:p-10">
            {activeTab === 'onsite' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 text-blue-900 text-sm">
                  🔹 <strong>ثبت‌نام اعتبارسنجی حضوری دیجی‌پی (Onsite Registration):</strong> مخصوص مشتریان مراجعه‌کننده به شعب. شرایط: سن ۱۸ تا ۷۰ سال + چک صیادی بنفش یا سفته الکترونیک.
                </div>

                {step === 1 ? (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 className="text-xl font-bold mb-6 text-slate-800">۱. ثبت مشخصات متقاضی خرید حضوری</h2>
                    <form onSubmit={handleRegister} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium mb-1 text-slate-700">شماره همراه متقاضی (بنام خود شخص)</label>
                        <input 
                          type="text" 
                          placeholder="۰۹۱۲۳۴۵۶۷۸۹" 
                          value={mobile} 
                          onChange={(e) => setMobile(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium mb-1 text-slate-700">کد ملی متقاضی</label>
                        <input 
                          type="text" 
                          placeholder="۰۰۱۲۳۴۵۶۷۸" 
                          value={nationalId} 
                          onChange={(e) => setNationalId(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium mb-1 text-slate-700">مبلغ خرید اعتباری (تومان)</label>
                        <input 
                          type="number" 
                          step="1000000"
                          value={amount} 
                          onChange={(e) => setAmount(Number(e.target.value))}
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                        />
                        <p className="text-xs text-slate-500 mt-1">سقف اعتبار حضوری: ۲۰۰,۰۰۰,۰۰۰ تومان</p>
                      </div>
                      <div>
                        <label className="block text-sm font-medium mb-1 text-slate-700">نوع ضمانت</label>
                        <select 
                          value={guaranteeType} 
                          onChange={(e) => setGuaranteeType(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                          <option value="cheque">چک صیادی بنفش</option>
                          <option value="promissory">سفته الکترونیکی (آنلاین)</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
                        استعلام اعتبار و ایجاد فاکتور حضوری
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-6">
                    <div className="inline-block bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-sm font-semibold">
                      ✓ فاکتور اعتبار با موفقیت صادر شد
                    </div>
                    
                    <div className="p-4 bg-slate-50 rounded-xl max-w-sm mx-auto border text-right text-sm space-y-2">
                      <div className="flex justify-between"><span>شماره متقاضی:</span> <strong>{mobile}</strong></div>
                      <div className="flex justify-between"><span>کد ملی:</span> <strong>{nationalId}</strong></div>
                      <div className="flex justify-between"><span>مبلغ وام:</span> <strong>{amount.toLocaleString('fa-IR')} تومان</strong></div>
                      <div className="flex justify-between"><span>هزینه ثبت‌نام حضوری شعبه:</span> <strong>۱۰۰,۰۰۰ تومان</strong></div>
                      <div className="flex justify-between border-t pt-2"><span>قسط ماهانه (۱۲ ماه):</span> <strong className="text-blue-600">{calculateMonthlyPayment(amount).toLocaleString('fa-IR')} تومان</strong></div>
                    </div>

                    <div className="space-y-3">
                      <p className="text-sm text-slate-600">از متقاضی بخواهید با سوپراپلیکیشن دیجی‌پی کد QR زیر را اسکن کند:</p>
                      <div className="w-44 h-44 bg-slate-200 mx-auto rounded-xl flex items-center justify-center text-slate-500 border border-slate-300 font-bold">
                        [ QR-Code دیجی‌پی ]
                      </div>
                    </div>

                    <div className="flex gap-3 justify-center">
                      <button onClick={() => alert('لینک اعتبارسنجی پیامک شد')} className="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl text-sm font-medium">
                        ارسال مجدد پیامک به مشتری
                      </button>
                      <button onClick={() => setStep(1)} className="bg-slate-200 hover:bg-slate-300 text-slate-800 px-5 py-2.5 rounded-xl text-sm font-medium">
                        بازگشت / درخواست جدید
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'calculator' && (
              <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 space-y-6">
                <h2 className="text-xl font-bold text-slate-800">شبیه‌ساز و محاسبه‌گر وام دیجی‌پی</h2>
                <div>
                  <label className="block text-sm mb-2">مبلغ وام: <strong>{amount.toLocaleString('fa-IR')} تومان</strong></label>
                  <input 
                    type="range" 
                    min="10000000" 
                    max="200000000" 
                    step="5000000" 
                    value={amount} 
                    onChange={(e) => setAmount(Number(e.target.value))}
                    className="w-full"
                  />
                </div>
                <div className="grid grid-cols-2 gap-4 text-center">
                  <div className="p-4 bg-slate-50 rounded-xl border">
                    <span className="text-xs text-slate-500 block">بازپرداخت</span>
                    <strong className="text-lg">۱۲ ماهه</strong>
                  </div>
                  <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                    <span className="text-xs text-blue-600 block">قسط ماهانه</span>
                    <strong className="text-lg text-blue-700">{calculateMonthlyPayment(amount).toLocaleString('fa-IR')} تومان</strong>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'transactions' && (
              <div className="bg-white p-6 rounded-2xl border border-slate-200">
                <h2 className="text-xl font-bold mb-4">آخرین تراکنش‌های اعتباری شعبه</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-right text-sm">
                    <thead className="bg-slate-100 text-slate-600">
                      <tr>
                        <th className="p-3 rounded-r-xl">کد پیگیری</th>
                        <th className="p-3">شماره همراه</th>
                        <th className="p-3">مبلغ</th>
                        <th className="p-3">ضمانت</th>
                        <th className="p-3 rounded-l-xl">وضعیت</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      <tr>
                        <td className="p-3 font-mono">DP-98213</td>
                        <td className="p-3">۰۹۱۲۳۴۵۶۷۸۹</td>
                        <td className="p-3">۵۰,۰۰۰,۰۰۰ تومان</td>
                        <td className="p-3">چک صیادی</td>
                        <td className="p-3"><span className="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full">موفق</span></td>
                      </tr>
                      <tr>
                        <td className="p-3 font-mono">DP-98214</td>
                        <td className="p-3">۰۹۳۶۱۴۸۶۷۲۸</td>
                        <td className="p-3">۱۲۰,۰۰۰,۰۰۰ تومان</td>
                        <td className="p-3">سفته الکترونیک</td>
                        <td className="p-3"><span className="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full">در انتظار اسکن QR</span></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DigiPayApp />);
  </script>
</body>
</html>
